name: ci
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pin to the build box's toolchain (F:\work\neolink on 192.168.93.9).
          # flutter analyze defaults to --fatal-infos, and Flutter 3.48+
          # deprecates package:flutter/material.dart (material_ui migration
          # is still a preview), so floating stable fails CI on infos the
          # shipped 3.47.8 binaries never see.
          flutter-version: 3.47.8
          cache: true
      - name: analyze + test + build
        shell: bash
        run: bash tool/ci.sh
      - name: upload windows build
        uses: actions/upload-artifact@v4
        with:
          name: neolink-windows-x64
          path: apps/desktop_app/build/windows/x64/runner/Release/
          if-no-files-found: warn
