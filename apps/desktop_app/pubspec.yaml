name: desktop_app
description: NeoLink Windows 桌面端（P0 首发参考实现入口）
publish_to: none
version: 0.2.0
environment:
  sdk: ^3.5.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Stage 3 QR spike: camera_windows gives preview + takePicture stills (no
  # frame stream on Windows), flutter_zxing decodes those stills via FFI
  # zxing-cpp. `camera` is the cross-platform facade whose API desktop_app
  # uses directly; recent facade versions ship no Windows implementation,
  # so the federated camera_windows (implements: camera) is declared too.
  # file_selector is the upload mode's file dialog; its Windows impl is
  # already in the build (flutter_zxing pulls it in), the facade is pure
  # Dart over the same platform interface.
  camera: ^0.11.0
  camera_windows: ^0.3.0+1
  flutter_zxing: ^1.8.2
  # QR decode normalizes packed source formats (1-bit label scans) to an
  # 8-bit RGB raster before the FFI call; already in the tree via
  # flutter_zxing, so this adds no new native code.
  image: ^4.1.0
  file_selector: ^1.0.3
  neolink_ui:
    path: ../../packages/neolink_ui
  ct_prov_core:
    path: ../../packages/ct_prov_core
  ble_adapter:
    path: ../../packages/ble_adapter
  ble_universal:
    path: ../../packages/ble_universal
  discovery_domain:
    path: ../../packages/discovery_domain
  provisioning_session:
    path: ../../packages/provisioning_session
  communication_domain:
    path: ../../packages/communication_domain
  test_vectors:
    path: ../../packages/test_vectors
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
